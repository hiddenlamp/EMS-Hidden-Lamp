services:
  - type: web
    name: hiddenlamp-payroll-api
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://ems.hiddenlamp.in
      - key: SESSION_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
